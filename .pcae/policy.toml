[protected]
patterns = [
  ".git/**",
  ".env",
  ".env.*",
  "*.pem",
  "*.key",
  "*.p12",
  "*.pfx",
  "**/__pycache__/**",
  ".venv/**",
  "venv/**",
  "node_modules/**",
  "pyproject.toml",
  "poetry.lock",
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
  "Cargo.toml",
  "Cargo.lock",
]

[architecture.zones]
core = ["src/pcae/core/**"]
commands = ["src/pcae/commands/**"]
cltr = ["src/pcae/cltr/**"]
cli = ["src/pcae/cli.py", "src/pcae/__main__.py", "src/pcae/__init__.py"]
schema_runtime = ["src/pcae/schema_runtime/**", "src/pcae/schema_resources/**"]
governance = ["src/pcae/governance/**"]
interactive_workflow = ["src/pcae/interactive_workflow/**"]
# Phase 147G: pcae.authority_evaluation (AEMIC-001 v1.0 core implementation)
# is a new, standalone sibling package. AEMIC-REQ-006 requires it never be
# nested inside any existing zone; AEMIC-REQ-010-013 require zero production
# dependency in either direction between this zone and any other.
authority_evaluation = ["src/pcae/authority_evaluation/**"]
# Phase 147M: pcae.aesic (AESIC-001 v1.3 Authority Evaluation Service
# integration) is a new, standalone sibling package -- deliberately named
# to avoid a bare-string sys.modules prefix collision with 147H's own
# "pcae.authority_evaluation"-prefixed cleanup logic (see
# docs/implementation/PHASE_147M_AUTHORITY_EVALUATION_INTEGRATION_IMPLEMENTATION.md
# §4), never nested inside the authority_evaluation zone.
aesic = ["src/pcae/aesic/**"]
tests = ["tests/**"]
docs = ["docs/**", "*.md"]
tasks = ["tasks/**"]
scripts = ["scripts/**"]
hooks = [".githooks/**"]
package = ["pyproject.toml"]
session = [".pcae/session.json"]
policy = [".pcae/policy.toml"]
config = [".pcae/**", "pyproject.toml"]

[architecture.rules]
# Phase 149L: pcae.core.rollback_approval_evidence (RAE-001 v1.0's
# evidence substrate, per Phase 149K's own module-ownership decision
# rejecting governance/interactive_workflow/cltr/agent.py/
# mutation_permission.py/permission_broker_foundation.py as the module's
# home) adds "governance" and "interactive_workflow" as narrow, one-way
# dependencies: `create_rollback_approval_decision` is a thin
# orchestration wrapper around the existing, unmodified CHGR
# Confirmation->Publication pipeline
# (pcae.governance.publication.coordinator.PublicationCoordinator,
# pcae.governance.publication.storage.PublicationRecordStore,
# pcae.governance.publication.chgr_envelope.chgr_timestamp,
# pcae.interactive_workflow.publication_handoff.models.PublicationReadinessPackage,
# pcae.interactive_workflow.models.session.SessionState,
# pcae.interactive_workflow.session.identity.generate_session_id) --
# RAE-REQ-079 names this pipeline, not a new parallel command family, as
# the architectural owner of Decision creation. No governance or
# interactive_workflow module imports back into core (verified by this
# repository's own import-graph tests,
# tests/test_rollback_approval_evidence_contract.py); the dependency
# remains strictly one-way, matching this file's own governance/
# interactive_workflow rules below.
core = ["core", "cltr", "governance", "interactive_workflow"]
# Phase 137K: pcae.commands.authority_inspect (commands) and
# pcae.cltr.authority_inspection (cltr) are TAMPC-001 v1.0's sole
# authorized production Typed Authority Model consumer, whose frozen
# dependency chain (docs/contracts/TYPED_AUTHORITY_MODEL_PRODUCTION_CONSUMPTION_CONTRACT.md)
# requires calling pcae.schema_runtime.* (parser/registry/manifest/
# validator) and pcae.schema_resources.cltr_cutover_root(), both in the
# schema_runtime zone.
# Phase 145G: pcae.commands.decision_session (IWPC-001 v1.1 CLI/transport
# adapter) and the `publish` addition to pcae.commands.governance_record add
# one dependency, "interactive_workflow": IWPC-REQ-174 names exactly this
# edge ("CLI decision-session adapter -> ... -> Interactive Workflow public
# interfaces"; "CLI publication adapter -> ... -> Publication Coordinator
# public interfaces", the latter already covered by the existing
# commands -> governance edge below). Scoped narrowly to
# pcae.interactive_workflow.application.session_service/publication_service
# (the Phase 145F application-service boundary), pcae.interactive_workflow.
# session.coordinator.SessionCoordinator and pcae.interactive_workflow.
# persistence.filesystem_repository/filesystem_pending_readiness_store
# (constructed only by decision_session.build_application_context, this
# phase's own narrow composition root) and pcae.interactive_workflow.
# serialization.schema.to_payload (rendering only) -- never
# WorkflowOrchestrator, PublicationHandoff, or any interactive_workflow
# submodule's private (`_`-prefixed) names (enforced by a dedicated
# AST-based forbidden-import test, tests/test_phase_145g_decision_session_cli.py).
# Phase 147O.1: pcae.commands.decision_session's composition root
# (build_application_context) constructs the production Authority
# Evaluation Service (AESIC-001 v1.3) -- FilesystemAuthorityRegistry,
# AuthorityEvaluationRecordStore, AuthorityEvaluationService -- and
# pcae.commands.aesic_status (new, read-only diagnostics) reads
# composition/configuration status the same way. Both import only
# pcae.aesic.composition/service/registry_filesystem/storage/errors,
# never pcae.authority_evaluation directly (that dependency already
# belongs to, and stays owned by, the aesic zone below).
commands = ["core", "commands", "cltr", "schema_runtime", "governance", "interactive_workflow", "aesic"]
cltr = ["cltr", "schema_runtime"]
cli = ["core", "commands", "cli"]
schema_runtime = ["schema_runtime"]
# Phase 143E: pcae.governance.inspection/verification (CHGR schema/artifact
# foundation, read-only) depends only on pcae.schema_resources.chgr_root()
# and pcae.schema_runtime.* (parser/registry/manifest/validator), both in
# the schema_runtime zone. It never depends on core, cltr, or commands.
# Phase 144C: pcae.governance.publication (PublicationCoordinator, PEC-001
# v1.0) adds two dependencies. "governance" (self): the package's own
# sibling modules (coordinator/models/record/storage/serialization/errors)
# import each other -- ordinary intra-package composition, not a new
# cross-zone coupling. "interactive_workflow": PEC-REQ-068 assigns
# Publication Readiness exclusively to
# pcae.interactive_workflow.publication_handoff.PublicationHandoff.is_ready()/
# validate_completeness(), so the Coordinator calls those two read-only,
# package-scoped methods directly as a stateless delegation rather than
# duplicating that logic (see docs/PHASE_144C_PUBLICATION_COORDINATOR_IMPLEMENTATION.md
# Sec.0, JC-1). It never depends on core, cltr, or commands.
governance = ["governance", "schema_runtime", "interactive_workflow"]
# Phase 143K: pcae.interactive_workflow (Interactive Workflow session
# infrastructure skeleton, IWC-001 v1.1) is structurally self-contained. It
# depends on no other production zone -- not core, cltr, commands, or
# governance -- per 143J's dependency-direction contract and the governing
# 143K prompt's explicit dependency rule (infrastructure may depend only on
# shared PCAE utilities, none of which are consumed by this skeleton yet).
# Phase 145F: pcae.interactive_workflow.application.publication_service
# (PublicationApplicationService, IWPC-001 v1.1) adds one dependency,
# "governance": this phase's own explicit Dependency Rules section
# authorizes application services to depend on "Publication interfaces",
# and IWPC-REQ-174 names exactly this edge ("CLI publication adapter ->
# ... -> Publication Coordinator public interfaces"). Scoped narrowly --
# publication_service.py imports only pcae.governance.publication's public
# PublicationCoordinator/errors/models, never pcae.governance.verification/
# inspection or any other governance subpackage (enforced by a dedicated
# AST-based forbidden-import test,
# tests/test_phase_145f_application_service_boundary.py). session_service.py
# and every other interactive_workflow module remain governance-independent
# (also directly enforced by that same test module).
# Phase 147M: pcae.interactive_workflow.application.session_service adds
# one dependency, "aesic": AESIC-REQ-063/066/067 require the caller
# above both Interactive Workflow and Publication to invoke AES at each
# stage, and session_service.py is that caller (construct_readiness_
# package/evaluate_authority_stage_1). Scoped to the optional,
# constructor-injected AuthorityEvaluationService collaborator only --
# never Interactive Workflow's own Session/Confirmation/state-machine
# code (AESIC-REQ-025, unaffected).
interactive_workflow = ["interactive_workflow", "governance", "aesic"]
# Phase 147G: pcae.authority_evaluation depends on nothing outside the
# standard library and its own sibling modules (AEMIC-REQ-011/013) -- zero
# production zone dependency, in either direction, for v1.0.
authority_evaluation = ["authority_evaluation"]
# Phase 147M: pcae.aesic (AESIC-001 v1.3) depends on the frozen, unmodified
# pcae.authority_evaluation package (AES wraps the pure evaluator/models/
# registry ABC, AESIC-REQ-014), pcae.interactive_workflow (the Session
# object type only, AESIC-REQ-008), and pcae.governance (reuses
# compute_record_digest unmodified from governance.publication.record,
# AESIC-REQ-055, rather than reimplementing digesting).
aesic = ["aesic", "authority_evaluation", "interactive_workflow", "governance"]
tests = ["*"]
docs = ["*"]
tasks = ["*"]
scripts = ["*"]
hooks = ["hooks"]
package = ["package"]
session = ["session"]
policy = ["policy"]
config = ["config"]

[architecture.enforcement]
mode = "advisory"

[agent]
stale_after_seconds = 14400

[daemon]
watch_interval_seconds = 300

[orchestration]
default_agent = "claude-local"
documentation_agent = "claude-local"
runtime_agent = "codex-local"
validation_agent = "pcae-native"

[agents.claude-local]
kind = "claude"
roles = ["documentation", "architecture", "analysis"]

[agents.codex-local]
kind = "codex"
roles = ["runtime", "implementation", "tests"]

[agents.pcae-native]
kind = "pcae"
roles = ["validation", "governance"]
